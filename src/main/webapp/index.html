<!DOCTYPE HTML>
<html>
<head>
    <meta charset="UTF-8">
    <title>Shopping Cart</title>
    <link rel="stylesheet" href="style/index.css" type="text/css"/>
</head>

<body>
    <p>CD list</p>

    <table>
        <tr>
            <th>Description</th>
            <th>Price</th>
            <th></th>
        </tr>
        <tr>
            <td>86 (the band) - True Life Songs and Pictures</td>
            <td>$14.95</td>
            <td>
                <form action="cart" method="post">
                    <input type="hidden" name="action" value="id01">
                    <button type="submit" id="add01">Add to Cart</button>
                </form>
            </td>
        </tr>
        <tr>
            <td>Paddle - The first CD</td>
            <td>$12.95</td>
            <td>            
                <form action="cart" method="post">
                    <input type="hidden" name="action" value="id02">
                    <button type="submit" id="add02">Add to Cart</button>
                </form>
            </td>
        </tr>
        <tr>
            <td>Paddle - The second CD </td>
            <td>$14.95</td>
            <td>
                <form action="cart" method="post">
                    <input type="hidden" name="action" value="id03">
                    <button type="submit" id="add03">Add to Cart</button>
                </form>
            </td>
        </tr>
        <tr>
            <td>Joe Rut - Genuine Wood Grained Finish</td>
            <td>$14.95</td>
            <td>
                <form action="cart" method="post">
                    <input type="hidden" name="action" value="id04">
                    <button type="submit" id="add04">Add to Cart</button>
                </form>                
            </td>
        </tr>
    </table>
</body>
</html>
